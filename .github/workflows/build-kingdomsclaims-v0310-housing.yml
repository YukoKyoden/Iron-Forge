name: Build Kingdoms Claims v0.3.10 Housing Lab Fix
on:
  push:
    branches: [kingdoms-claims-v0310-housing-fix]
    paths:
      - ci/kingdomsclaims-v0310-housing.tar.xz.base64
      - .github/workflows/build-kingdomsclaims-v0310-housing.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Extract and test enclosure + multi-floor scanner
        run: |
          base64 -d ci/kingdomsclaims-v0310-housing.tar.xz.base64 | tar -xJf -
          python3 kingdoms-claims-forge/tests/source_checks.py
      - name: Compile Forge 1.20.1
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Validate JAR
        run: |
          JAR=kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.10.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/HousingSurvey.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/HousingSurvey\$Result.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/EconomyService.class'
      - uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-v0.3.10-housing-lab-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.10.jar
          if-no-files-found: error

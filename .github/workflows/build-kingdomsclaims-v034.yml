name: Build Kingdoms Claims v0.3.4 Unified War Table
on:
  push:
    branches: [kingdoms-claims-v034]
    paths:
      - ci/kingdomsclaims-v034.tar.xz.base64
      - .github/workflows/build-kingdomsclaims-v034.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract project and validate world map / GUI
        run: |
          base64 -d ci/kingdomsclaims-v034.tar.xz.base64 | tar -xJf -
          python3 kingdoms-claims-forge/tests/source_checks.py
      - name: Build Minecraft Forge 1.20.1
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Check built JAR
        run: |
          JAR=kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.4.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/WarMapClient.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/WarMapNetwork.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/WarMapData.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/WarTableService.class'
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-v0.3.4-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.4.jar
          if-no-files-found: error

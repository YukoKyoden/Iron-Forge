name: Build Kingdoms Claims v0.3.0 Barracks
on:
  push:
    branches: [kingdoms-claims-v030]
    paths:
      - ci/kingdomsclaims-v030.tar.xz.base64
      - .github/workflows/build-kingdomsclaims-v030.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract and check project
        run: |
          base64 -d ci/kingdomsclaims-v030.tar.xz.base64 | tar -xJf -
          python3 kingdoms-claims-forge/tests/source_checks.py
      - name: Compile Forge 1.20.1 mod
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Check installable JAR and military assets
        run: |
          JAR=kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.0.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/BarracksBlock.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/BarracksNetwork.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/SoldierEntity.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/SoldierRenderer.class'
          jar tf "$JAR" | grep -q 'data/kingdomsclaims/recipes/barracks_controller.json'
          jar tf "$JAR" | grep -q 'assets/kingdomsclaims/textures/entity/militia.png'
          jar tf "$JAR" | grep -q 'assets/kingdomsclaims/textures/block/barracks_controller.png'
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-v0.3.0-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.0.jar
          if-no-files-found: error

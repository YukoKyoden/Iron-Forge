name: Build editable Kingdoms & Claims source
on:
  push:
    branches: [kingdoms-claims-v0426-simplification]
    paths:
      - 'mod/**'
      - '.github/workflows/build-editable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build editable Forge mod
        working-directory: mod
        run: gradle --no-daemon --stacktrace clean build
      - name: Check generated Forge JAR
        run: |
          set -e
          jarfile=$(find mod/build/libs -maxdepth 1 -name 'kingdomsclaims-*.jar' ! -name '*sources*' | head -n 1)
          test -n "$jarfile"
          jar tf "$jarfile" | grep -q META-INF/mods.toml
          jar tf "$jarfile" | grep -q com/kingdomsclaims/
      - uses: actions/upload-artifact@v4
        with:
          name: KingdomsClaims-editable-branch-JAR
          path: mod/build/libs/kingdomsclaims-*.jar
          if-no-files-found: error

name: Build Iron Forge Campaign v0.5
on:
  push:
    branches: [main]
    paths:
      - ironforge-v050-project.zip
      - .github/workflows/build-campaign.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract project
        run: |
          test -f ironforge-v050-project.zip || { echo "::error::Upload ironforge-v050-project.zip to repository root"; exit 1; }
          mkdir -p campaign
          cd campaign
          unzip -q ../ironforge-v050-project.zip
      - name: Test strategy, economy, campaign and persistence
        working-directory: campaign
        run: |
          mkdir -p build/tests
          javac --release 17 -d build/tests src/main/java/com/kingdomsatwar/WarState.java src/test/java/com/kingdomsatwar/*.java
          java -cp build/tests com.kingdomsatwar.WarStateTest
          java -cp build/tests com.kingdomsatwar.WarRegressionTest
          java -cp build/tests com.kingdomsatwar.WarCampaignTest
      - name: Build Forge mod
        working-directory: campaign
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify installable jar
        working-directory: campaign
        run: |
          test -f build/libs/kingdomsatwar-0.5.0-alpha.jar
          jar tf build/libs/kingdomsatwar-0.5.0-alpha.jar | grep -q 'META-INF/mods.toml'
          jar tf build/libs/kingdomsatwar-0.5.0-alpha.jar | grep -q 'com/kingdomsatwar/WarMapScreen.class'
      - name: Upload Minecraft mod
        uses: actions/upload-artifact@v4
        with:
          name: iron-forge-v0.5.0-campaign-jar
          path: campaign/build/libs/kingdomsatwar-0.5.0-alpha.jar
          if-no-files-found: error

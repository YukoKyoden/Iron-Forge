name: Build Kingdoms Claims v0.3.1 War Table
on:
  push:
    branches: [kingdoms-claims-v031]
    paths:
      - ci/kingdomsclaims-v031.tar.xz.base64
      - .github/workflows/build-kingdomsclaims-v031.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract source and validate military ledger
        run: |
          base64 -d ci/kingdomsclaims-v031.tar.xz.base64 | tar -xJf -
          python3 kingdoms-claims-forge/tests/source_checks.py
      - name: Build Minecraft Forge 1.20.1
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify War Table and player-shaped soldier assets in JAR
        run: |
          JAR=kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.1.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/MilitaryData.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/WarTableBlock.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/WarTableClient.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/WarTableNetwork.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/BarracksService.class'
          jar tf "$JAR" | grep -q 'assets/kingdomsclaims/textures/entity/town_militia.png'
          jar tf "$JAR" | grep -q 'assets/kingdomsclaims/textures/entity/kingdom_soldier.png'
          jar tf "$JAR" | grep -q 'assets/kingdomsclaims/textures/block/war_table.png'
          jar tf "$JAR" | grep -q 'data/kingdomsclaims/recipes/war_table.json'
      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-v0.3.1-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.1.jar
          if-no-files-found: error

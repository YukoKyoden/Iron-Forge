name: Build Iron Forge Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract compatible original project
        run: git show d18f39bab92e06e0b912fd3aba457e14b5b69a8e:iron-forge-source.tar.xz | tar -xJf -
      - name: Apply Iron Forge 0.3 upgrade
        run: xz -dc iron-forge-v030.patch.xz | patch --batch -p4
      - name: Repair command registration nesting
        run: sed -i '32s/$/)/;34s/$/)/;65s/);/));/' src/main/java/com/kingdomsatwar/WarCommands.java
      - name: Test kingdom and warfare strategy
        run: |
          mkdir -p build/simtest
          javac --release 17 -d build/simtest src/main/java/com/kingdomsatwar/WarState.java src/test/java/com/kingdomsatwar/WarStateTest.java
          java -cp build/simtest com.kingdomsatwar.WarStateTest
      - name: Build Forge 1.20.1 jar
        run: gradle --no-daemon --stacktrace clean build
      - name: Validate mod jar
        run: |
          test -f build/libs/kingdomsatwar-0.3.0-alpha.jar
          jar tf build/libs/kingdomsatwar-0.3.0-alpha.jar | grep -q 'META-INF/mods.toml'
          jar tf build/libs/kingdomsatwar-0.3.0-alpha.jar | grep -q 'com/kingdomsatwar/WarTable.class'
          jar tf build/libs/kingdomsatwar-0.3.0-alpha.jar | grep -q 'com/kingdomsatwar/WarMapScreen.class'
      - name: Upload mod for CurseForge profile
        uses: actions/upload-artifact@v4
        with:
          name: iron-forge-v0.3.0-forge-1.20.1
          path: build/libs/kingdomsatwar-0.3.0-alpha.jar
          if-no-files-found: error
name: Build Kingdoms and Claims v0.4.9
on:
  push:
    branches: [kingdoms-claims-v049-hologram]
    paths:
      - '.github/workflows/build.yml'
      - 'kingdoms-claims-v049-source.b64.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract Kingdoms and Claims v0.4.9 project
        run: |
          mkdir -p kc
          base64 -d kingdoms-claims-v049-source.b64.txt > kc-src.tar.xz
          tar -xJf kc-src.tar.xz -C kc
          test -f kc/kingdoms-claims-forge/build.gradle
      - name: Source consistency checks
        working-directory: kc/kingdoms-claims-forge
        run: python3 tests/source_checks.py
      - name: Build Forge 1.20.1 mod
        working-directory: kc/kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify installable JAR
        run: |
          set -e
          find kc/kingdoms-claims-forge/build/libs -type f -name '*.jar' -print
          modjar=$(find kc/kingdoms-claims-forge/build/libs -maxdepth 1 -name 'kingdomsclaims-0.4.9.jar' | head -n 1)
          test -n "$modjar"
          jar tf "$modjar" | grep -q 'META-INF/mods.toml'
          jar tf "$modjar" | grep -q 'com/kingdomsclaims/'
      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: KingdomsClaims-v0.4.9-Forge-1.20.1
          path: kc/kingdoms-claims-forge/build/libs/kingdomsclaims-0.4.9.jar
          if-no-files-found: error

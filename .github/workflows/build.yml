name: Build Kingdoms and Claims v0.4.26.2
on:
  push:
    branches: [kingdoms-claims-v0426-simplification]
    paths: ['mod/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Test stockpile transactions and housing geometry
        working-directory: mod
        run: |
          mkdir -p build/regression
          javac --release 17 -d build/regression src/main/java/com/kingdomsclaims/StockpileMath.java tests/StockpileMathTest.java src/main/java/com/kingdomsclaims/ArchitectInputGate.java tests/ArchitectInputGateTest.java src/main/java/com/kingdomsclaims/HouseBuildCost.java tests/HouseBuildCostTest.java src/main/java/com/kingdomsclaims/HousingMath.java tests/HousingMathTest.java
          java -cp build/regression StockpileMathTest
          java -cp build/regression ArchitectInputGateTest
          java -cp build/regression HouseBuildCostTest
          java -cp build/regression HousingMathTest
          python3 tests/test_0426.py
      - name: Build and reobfuscate Forge 1.20.1 mod
        working-directory: mod
        run: gradle --no-daemon --stacktrace clean build ledgerRegression
      - name: Verify compiled JAR
        run: |
          test -f mod/build/libs/kingdomsclaims-0.4.26.2.jar
          jar tf mod/build/libs/kingdomsclaims-0.4.26.2.jar | grep -q META-INF/mods.toml
          jar tf mod/build/libs/kingdomsclaims-0.4.26.2.jar | grep -q com/kingdomsclaims/RegisteredBuildings.class
      - uses: actions/upload-artifact@v4
        with:
          name: KingdomsClaims-v0.4.26.2-Forge-1.20.1
          path: mod/build/libs/kingdomsclaims-0.4.26.2.jar
          if-no-files-found: error

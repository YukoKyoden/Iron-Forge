name: Build Kingdoms at War Forge Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract mod source
        run: |
          tar -xJf iron-forge-source.tar.xz
          sed -i "s/version = '0.1.1-alpha'/version = '0.2.0-alpha'/" build.gradle
          sed -i 's/version="0.1.1-alpha"/version="0.2.0-alpha"/' src/main/resources/META-INF/mods.toml
      - name: Test strategy simulation
        run: |
          mkdir -p build/simtest
          javac --release 17 -d build/simtest src/main/java/com/kingdomsatwar/WarState.java src/test/java/com/kingdomsatwar/WarStateTest.java
          java -cp build/simtest com.kingdomsatwar.WarStateTest
      - name: Build Forge 1.20.1 mod
        run: gradle --no-daemon --stacktrace clean build
      - name: Validate mod JAR
        run: |
          test -f build/libs/kingdomsatwar-0.2.0-alpha.jar
          jar tf build/libs/kingdomsatwar-0.2.0-alpha.jar | grep -q META-INF/mods.toml
          jar tf build/libs/kingdomsatwar-0.2.0-alpha.jar | grep -q com/kingdomsatwar/WarMapScreen.class
      - name: Upload drag-and-drop mod
        uses: actions/upload-artifact@v4
        with:
          name: kingdoms-at-war-graphical-map-1.20.1
          path: build/libs/kingdomsatwar-0.2.0-alpha.jar
          if-no-files-found: error
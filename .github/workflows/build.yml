name: Build Kingdoms and Claims v0.4.22
on:
  push:
    branches: [kingdoms-claims-v0422-crash-shelves]
    paths:
      - '.github/workflows/build.yml'
      - 'kingdomsclaims-v0422-src.b64.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract Kingdoms and Claims v0.4.22 project
        run: |
          mkdir -p kc
          base64 -d kingdomsclaims-v0422-src.b64.txt > kc-src.tar.xz
          tar -xJf kc-src.tar.xz -C kc
          test -f kc/kingdoms-claims-forge/build.gradle
      - name: Source consistency checks
        working-directory: kc/kingdoms-claims-forge
        run: python3 tests/source_checks.py
      - name: Test house capacity geometry
        working-directory: kc/kingdoms-claims-forge
        run: |
          mkdir -p build/housingtest
          javac --release 17 -d build/housingtest src/main/java/com/kingdomsclaims/HousingMath.java tests/HousingMathTest.java
          java -cp build/housingtest HousingMathTest
      - name: Verify new claims and depot safeguards
        working-directory: kc/kingdoms-claims-forge
        run: python3 tests/test_0417.py
      - name: Verify physical inventory links and local transfers
        working-directory: kc/kingdoms-claims-forge
        run: python3 tests/test_0418.py
      - name: Verify modular warehouse capacity and performance safeguards
        working-directory: kc/kingdoms-claims-forge
        run: python3 tests/test_0419.py
      - name: Verify 3D claims and modular storage safeguards
        working-directory: kc/kingdoms-claims-forge
        run: |
          python3 tests/test_0417.py
          python3 tests/test_0418.py
          python3 tests/test_0419.py
      - name: Validate v0.4.22 chain warehouse and render models
        working-directory: kc/kingdoms-claims-forge
        run: python3 tests/test_0421.py
      - name: Validate v0.4.22 claim click safety and shelf assets
        working-directory: kc/kingdoms-claims-forge
        run: python3 tests/test_0422.py
      - name: Build Forge 1.20.1 mod
        working-directory: kc/kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify installable JAR
        run: |
          set -e
          find kc/kingdoms-claims-forge/build/libs -type f -name '*.jar' -print
          modjar=$(find kc/kingdoms-claims-forge/build/libs -maxdepth 1 -name 'kingdomsclaims-0.4.22.jar' | head -n 1)
          test -n "$modjar"
          jar tf "$modjar" | grep -q 'META-INF/mods.toml'
          jar tf "$modjar" | grep -q 'com/kingdomsclaims/'
      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: KingdomsClaims-v0.4.22-Forge-1.20.1
          path: kc/kingdoms-claims-forge/build/libs/kingdomsclaims-0.4.22.jar
          if-no-files-found: error

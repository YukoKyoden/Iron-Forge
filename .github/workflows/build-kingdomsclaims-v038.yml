name: Build Kingdoms Claims v0.3.8 Treasury Interface Fix
on:
  push:
    branches: [kingdoms-claims-v038]
    paths:
      - ci/kingdomsclaims-v038.tar.xz.base64
      - .github/workflows/build-kingdomsclaims-v038.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Extract source and test treasury regression checks
        run: |
          base64 -d ci/kingdomsclaims-v038.tar.xz.base64 | tar -xJf -
          python3 kingdoms-claims-forge/tests/source_checks.py
      - name: Compile Minecraft Forge 1.20.1
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify release JAR
        run: |
          JAR=kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.8.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          for cl in EconomyService OperationsService OperationsNetwork MilitaryData WarMapClient KingdomData; do
            jar tf "$JAR" | grep -q "com/kingdomsclaims/${cl}.class"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-v0.3.8-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.3.8.jar
          if-no-files-found: error

name: Build Kingdoms Claims v0.2.3 Town Directory
on:
  push:
    branches: [kingdoms-claims-v023]
    paths:
      - ci/kingdomsclaims-v023.tar.xz.base64
      - .github/workflows/build-kingdomsclaims-v023.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract and check project
        run: |
          base64 -d ci/kingdomsclaims-v023.tar.xz.base64 | tar -xJf -
          python3 kingdoms-claims-forge/tests/source_checks.py
      - name: Compile Forge mod
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify mod JAR contents
        run: |
          JAR=kingdoms-claims-forge/build/libs/kingdomsclaims-0.2.3.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/TownHallClient.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/TownHallNetwork.class'
          jar tf "$JAR" | grep -q 'com/kingdomsclaims/KingdomService.class'
          jar tf "$JAR" | grep -q 'data/kingdomsclaims/recipes/kingdom_banner.json'
          jar tf "$JAR" | grep -q 'data/kingdomsclaims/recipes/town_banner.json'
      - name: Upload installable jar
        uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-v0.2.3-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.2.3.jar
          if-no-files-found: error

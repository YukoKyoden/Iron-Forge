name: Build Kingdoms Claims v0.2
on:
  push:
    branches: [kingdoms-claims-v02]
    paths:
      - ci/kingdomsclaims-v02.tar.xz.base64
      - .github/workflows/build-kingdomsclaims-v02.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract mod project
        run: |
          base64 -d ci/kingdomsclaims-v02.tar.xz.base64 | tar -xJf -
          test -f kingdoms-claims-forge/build.gradle
      - name: Build Minecraft Forge 1.20.1 JAR
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify installable JAR
        run: |
          test -f kingdoms-claims-forge/build/libs/kingdomsclaims-0.2.0.jar
          jar tf kingdoms-claims-forge/build/libs/kingdomsclaims-0.2.0.jar | grep -q 'META-INF/mods.toml'
          jar tf kingdoms-claims-forge/build/libs/kingdomsclaims-0.2.0.jar | grep -q 'com/kingdomsclaims/KingdomService.class'
          jar tf kingdoms-claims-forge/build/libs/kingdomsclaims-0.2.0.jar | grep -q 'com/kingdomsclaims/TerritoryClient.class'
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-v0.2.0-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.2.0.jar
          if-no-files-found: error

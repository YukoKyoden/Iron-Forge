name: Build Iron Forge Reboot Physical Recruits
on:
  push:
    branches: [reboot/kingdom-warfare-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract compatible original project
        run: git show d18f39bab92e06e0b912fd3aba457e14b5b69a8e:iron-forge-source.tar.xz | tar -xJf -
      - name: Apply Iron Forge 0.3 upgrade
        run: xz -dc iron-forge-v030.patch.xz | patch --batch -p4
      - name: Repair command registration nesting
        run: sed -i '32s/$/)/;34s/$/)/;65s/);/));/' src/main/java/com/kingdomsatwar/WarCommands.java
      - name: Fix War Table buttons and server responses
        run: |
          base64 -d iron-forge-map-button-fix.patch.xz.base64 | xz -dc | patch --batch -p1
          sed -i "s/version = '0.3.0-alpha'/version = '0.3.1-alpha'/" build.gradle
      - name: Apply Iron Forge 0.4 army warfare and diplomacy
        run: | 
          sed -i "s/version = '0.3.1-alpha'/version = '0.3.0-alpha'/" build.gradle
          base64 -d patches/v040.part1 | xz -dc | patch --batch -p1
      - name: Advance observed formations into actual melee range
        run: base64 -d patches/v041.b64 | xz -dc | patch --batch -p1
      - name: Add training cleanup command and GUI control
        run: base64 -d patches/v042.b64 | xz -dc | patch --batch -p1
      - name: Apply v0.5.0 command and training fixes
        run: python3 ci/apply_v043.py
      - name: Install gameplay regression suite
        run: cp ci/WarRegressionTest.java src/test/java/com/kingdomsatwar/WarRegressionTest.java
      - name: Apply v0.5 AI campaign, economy, and War Table changes
        run: base64 -d patches/v050.b64 | xz -dc | patch --batch -p1
      - name: Apply v0.6 army combat logistics and UI
        run: base64 -d patches/v060.b64 | xz -dc | patch --batch -p1
      - name: Integrate physical mining module
        run: python3 reboot-module/integrate.py
      - name: Test geological mine simulation without Minecraft
        run: |
          mkdir -p build/geologytest
          javac --release 17 -d build/geologytest src/main/java/com/kingdomsatwar/MineEconomy.java src/test/java/com/kingdomsatwar/MineEconomyTest.java
          java -cp build/geologytest com.kingdomsatwar.MineEconomyTest
      - name: Verify command permissions and registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cmd=Path('src/main/java/com/kingdomsatwar/WarCommands.java').read_text()
          net=Path('src/main/java/com/kingdomsatwar/WarMapNetwork.java').read_text()
          assert 'literal("skirmish").executes' in cmd
          assert 'literal("endtest").executes' in cmd
          assert 'literal("skirmish").requires' not in cmd
          assert 'Training requires Creative mode or operator permission.' in cmd
          assert 'player.isCreative()' in net
          print('PASS: both test commands visible; practice is permission-checked at execution time.')
          PY
      - name: Test kingdom and warfare strategy
        run: |
          mkdir -p build/simtest
          javac --release 17 -d build/simtest src/main/java/com/kingdomsatwar/WarState.java src/test/java/com/kingdomsatwar/WarStateTest.java src/test/java/com/kingdomsatwar/WarRegressionTest.java src/test/java/com/kingdomsatwar/WarCampaignTest.java src/test/java/com/kingdomsatwar/WarArmySystemsTest.java
          java -cp build/simtest com.kingdomsatwar.WarStateTest
          java -cp build/simtest com.kingdomsatwar.WarRegressionTest
          java -cp build/simtest com.kingdomsatwar.WarCampaignTest
          java -cp build/simtest com.kingdomsatwar.WarArmySystemsTest
      - name: Build Forge 1.20.1 jar
        run: gradle --no-daemon --stacktrace clean build
      - name: Validate mod jar
        run: |
          test -f build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'META-INF/mods.toml'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/WarTable.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/WarMapScreen.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/WarVisuals.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/MineEconomy.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/MineBlocks.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/MineRuntime.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/MineControllerBlock.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/MineControllerBlockEntity.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/MineBlueprint.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/IronRecruit.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/IronRecruitRegistry.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/IronRecruitRuntime.class'
          jar tf build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar | grep -q 'com/kingdomsatwar/IronRecruitClient.class'
      - name: Verify mining registry wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          table=Path('src/main/java/com/kingdomsatwar/WarTable.java').read_text()
          mines=Path('src/main/java/com/kingdomsatwar/MineBlocks.java').read_text()
          assert 'BLOCKS.register("mine_support"' in table
          assert 'BLOCKS.register("mine_controller"' in table
          assert 'new BlockItem(MINE_SUPPORT.get()' in table
          assert 'new BlockItem(MINE_CONTROLLER.get()' in table
          assert 'private static final Block MINE_SUPPORT_BLOCK' not in table
          assert 'Properties.copy(Blocks.OAK_PLANKS)' in table
          assert 'Properties.copy(Blocks.OAK_LOG)' not in table
          assert 'private static final Block MINE_CONTROLLER_BLOCK' not in table
          assert 'MineBlocks.init' not in mines
          runtime=Path('src/main/java/com/kingdomsatwar/MineRuntime.java').read_text()
          assert 'game.claimAt(' not in runtime
          assert 'A mine controller must be on your kingdom' not in runtime
          controller=Path('src/main/java/com/kingdomsatwar/MineControllerBlock.java').read_text()
          entity=Path('src/main/java/com/kingdomsatwar/MineControllerBlockEntity.java').read_text()
          economy=Path('src/main/java/com/kingdomsatwar/MineEconomy.java').read_text()
          assert 'MineControllerBlock::new' in table
          assert 'new BlockItem(MINE_CONTROLLER.get()' in table
          assert 'MineControllerBlockEntity.init' in Path('src/main/java/com/kingdomsatwar/KingdomsAtWar.java').read_text()
          assert 'ChestMenu.threeRows' in entity
          assert 'MineBlueprint.check' in entity
          assert 'if(!m.built)' in economy or '!m.built' in economy
          print('PASS: chest blueprint, construction gating and tile registration wired')
          print('PASS: mining has no manual chunk-claim prerequisite')
          print('PASS: mine blocks and items share WarTable registry without early block lookup')
          PY
      - name: Check villager recruitment server wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/main/java/com/kingdomsatwar')
          entry=(src/'KingdomsAtWar.java').read_text()
          mob=(src/'IronRecruit.java').read_text()
          register=(src/'IronRecruitRegistry.java').read_text()
          runtime=(src/'IronRecruitRuntime.java').read_text()
          client=(src/'IronRecruitClient.java').read_text()
          assert 'IronRecruitRegistry.init' in entry
          assert 'IronRecruitRuntime.instance()' in entry
          assert 'EntityAttributeCreationEvent' in register
          assert 'registerEntityRenderer' in client and 'Dist.CLIENT' in client
          assert 'setPersistenceRequired()' in mob and 'IronForgeKingdom' in mob
          assert 'MeleeAttackGoal' in mob and 'SoldierMoveGoal' in mob
          assert 'HIRE_COST=16' in runtime and 'villager.discard()' in runtime
          print('PASS: server-side hiring, saved identity, real AI and sided renderer are wired')
          PY
      - name: Headless Minecraft client registry smoke
        timeout-minutes: 4
        run: |
          set +e
          timeout --signal=INT --kill-after=5s 75s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 gradle --no-daemon runClient > client-smoke.log 2>&1
          code=$?
          set -e
          if grep -Eiq 'Registry Object not present|Registry is already frozen|ExceptionInInitializerError|Mod Loading has failed|Loading errors encountered|Errors during registry event dispatch|ModLoadingException|broken mod state|Crash report saved' client-smoke.log; then
            tail -n 100 client-smoke.log
            echo 'FAIL: Forge client registry initialization'
            exit 1
          fi
          if grep -Fq '[Render thread/INFO]' client-smoke.log; then
            echo 'PASS: Minecraft client reached render loop with mod loaded'
          else
            echo "Client smoke test inconclusive (exit $code)."
            tail -n 60 client-smoke.log
            exit 1
          fi
      - name: Upload client smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-forge-v0.9.0-client-smoke-log
          path: client-smoke.log
          if-no-files-found: ignore
      - name: Headless Forge dedicated-server smoke test
        timeout-minutes: 5
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=10s 105s gradle --no-daemon runServer > server-smoke.log 2>&1
          result=$?
          set -e
          if grep -Eiq 'Mod Loading has failed|LoadingFailedException|Registry Object not present|Registry is already frozen|ExceptionInInitializerError|Failed to start the minecraft server|Failed to create mod instance|Crash report saved' server-smoke.log run/logs/latest.log 2>/dev/null; then
            echo 'FAIL: mod initialization failed on dedicated server'
            tail -n 120 server-smoke.log
            exit 1
          fi
          if grep -Eq 'Done \(.*\)! For help|Done \(.*\)!|Done .* For help' server-smoke.log run/logs/latest.log 2>/dev/null; then
            echo 'PASS: dedicated server reached ready state'
          else
            echo 'SERVER SMOKE NOT VERIFIED; see server-smoke.log'
            tail -n 100 server-smoke.log
            exit 1
          fi
      - name: Upload server startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-forge-reboot-geology-server-smoke
          path: |
            server-smoke.log
            run/logs/latest.log
          if-no-files-found: ignore
      - name: Upload mod for CurseForge profile
        uses: actions/upload-artifact@v4
        with:
          name: iron-forge-reboot-v0.9.0-physical-recruits
          path: build/libs/kingdomsatwar-0.9.0-recruits-alpha.jar
          if-no-files-found: error
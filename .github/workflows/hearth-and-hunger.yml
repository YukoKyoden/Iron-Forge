name: Build Hearth & Hunger
on:
  push:
    branches: [hearth-and-hunger]
    paths:
      - 'hearth-and-hunger/**'
      - 'hearth-and-hunger-source*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build NeoForge mod
        working-directory: hearth-and-hunger
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify JAR
        working-directory: hearth-and-hunger
        run: |
          test -f build/libs/hearth-and-hunger-0.1.2.jar
          jar tf build/libs/hearth-and-hunger-0.1.2.jar | grep 'META-INF/neoforge.mods.toml'
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-and-hunger-0.1.2
          path: hearth-and-hunger/build/libs/*.jar
          if-no-files-found: error

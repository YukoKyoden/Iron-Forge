name: Build Kingdoms Claims Restart
on:
  push:
    branches: [kingdoms-claims-restart-v01]
    paths:
      - Kingdoms_Claims_Forge_1.20.1_Source_v0.1.zip
      - .github/workflows/build-kingdoms-claims-restart.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Unpack restart project
        run: |
          test -f Kingdoms_Claims_Forge_1.20.1_Source_v0.1.zip || { echo "::error::Upload the source ZIP to this branch root"; exit 1; }
          unzip -q Kingdoms_Claims_Forge_1.20.1_Source_v0.1.zip
      - name: Build Forge 1.20.1 mod
        working-directory: kingdoms-claims-forge
        run: gradle --no-daemon --stacktrace clean build
      - name: Validate JAR
        run: |
          test -f kingdoms-claims-forge/build/libs/kingdomsclaims-0.1.0.jar
          jar tf kingdoms-claims-forge/build/libs/kingdomsclaims-0.1.0.jar | grep -q META-INF/mods.toml
          jar tf kingdoms-claims-forge/build/libs/kingdomsclaims-0.1.0.jar | grep -q com/kingdomsclaims/KingdomsClaims.class
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: kingdomsclaims-0.1.0-forge-1.20.1
          path: kingdoms-claims-forge/build/libs/kingdomsclaims-0.1.0.jar
          if-no-files-found: error

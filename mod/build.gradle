plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.4.27.2'
group = 'com.kingdomsclaims'
base { archivesName = 'kingdomsclaims' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { kingdomsclaims { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods { kingdomsclaims { source sourceSets.main } }
        }
    }
}

repositories { }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.28' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar').configure { finalizedBy 'reobfJar' }

tasks.register('ledgerRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingdomsclaims.LedgerPersistenceTest'
}
